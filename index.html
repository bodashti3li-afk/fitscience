<!DOCTYPE html>
<html dir="ltr" lang="en" id="root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHM 101 — Final Exam Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e1a;
  --bg-2:#0f1422;
  --surface:#161b2d;
  --surface-2:#1d2438;
  --border:#262d44;
  --border-light:#323a55;
  --text:#e8ecf4;
  --text-dim:#9aa3b8;
  --text-mute:#6b7494;
  --accent:#f5b942;
  --accent-2:#ff6b6b;
  --green:#4ade80;
  --green-dark:#16a34a;
  --red:#f87171;
  --blue:#60a5fa;
  --purple:#c084fc;
  --pink:#f472b6;
  --cyan:#22d3ee;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body{font-family:'Inter',sans-serif;line-height:1.6}
body.ar{font-family:'Tajawal',sans-serif}
body::before{
  content:"";position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 0%,rgba(245,185,66,.08),transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 100%,rgba(96,165,250,.06),transparent 60%),
    radial-gradient(ellipse 50% 40% at 50% 50%,rgba(192,132,252,.04),transparent 70%);
  pointer-events:none;z-index:0;
}

/* Particles background */
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;border-radius:50%;opacity:.3;animation:float 20s infinite linear}
@keyframes float{
  0%{transform:translateY(100vh) translateX(0) rotate(0deg)}
  100%{transform:translateY(-100vh) translateX(50px) rotate(360deg)}
}

/* Layout */
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh;position:relative;z-index:1}
.ar .app{direction:rtl}

aside{
  background:linear-gradient(180deg,var(--bg-2) 0%,#0c1120 100%);
  border-right:1px solid var(--border);
  padding:20px 16px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:14px;
}
.ar aside{border-right:0;border-left:1px solid var(--border)}
aside::-webkit-scrollbar{width:6px}
aside::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.brand{display:flex;align-items:center;gap:12px;padding:8px 4px}
.brand .logo{font-size:32px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.brand .name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;color:var(--text)}
.brand .sub{font-size:11px;color:var(--text-mute);letter-spacing:.5px;text-transform:uppercase}

/* Language toggle */
.lang-toggle{display:flex;background:var(--surface);border-radius:10px;padding:3px;border:1px solid var(--border)}
.lang-btn{flex:1;padding:7px 0;background:transparent;border:0;color:var(--text-dim);font-weight:600;font-size:13px;cursor:pointer;border-radius:7px;transition:all .2s;font-family:inherit}
.lang-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#0a0e1a}

/* Timer */
.timer-box{background:linear-gradient(135deg,rgba(245,185,66,.12),rgba(255,107,107,.08));border:1px solid rgba(245,185,66,.25);border-radius:12px;padding:12px;text-align:center}
.timer-label{font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:4px}
.timer{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;color:var(--text);letter-spacing:1px}

/* Progress */
.prog-section{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.prog-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.prog-row .val{color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:13px}
.prog-bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));border-radius:3px;transition:width .5s ease;width:0%}

/* Nav */
.nav-section{display:flex;flex-direction:column;gap:2px}
.nav-title{font-size:10px;color:var(--text-mute);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;padding:8px 8px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--text-dim);font-size:13px;font-weight:500;transition:all .15s;border:1px solid transparent}
.nav-item:hover{background:var(--surface);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg,rgba(245,185,66,.15),rgba(245,185,66,.05));color:var(--accent);border-color:rgba(245,185,66,.2)}
.nav-item .icon{width:24px;height:24px;display:grid;place-items:center;background:var(--surface-2);border-radius:6px;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.nav-item.active .icon{background:var(--accent);color:#0a0e1a}
.nav-item .label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0;transition:all .3s}
.nav-item .dot.done{background:var(--green);box-shadow:0 0 8px var(--green)}
.nav-item .dot.partial{background:var(--accent)}

/* Main */
main{padding:32px 48px;max-width:1100px;width:100%;margin:0 auto}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:-100%;width:280px;z-index:100;transition:left .3s}
  .ar aside{left:auto;right:-100%}
  aside.open{left:0}
  .ar aside.open{right:0}
  main{padding:20px}
  .menu-btn{display:grid !important}
}
.menu-btn{display:none;position:fixed;top:16px;right:16px;z-index:101;width:44px;height:44px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);cursor:pointer;place-items:center;font-size:20px}
.ar .menu-btn{right:auto;left:16px}

/* Page header */
.page-hero{position:relative;margin-bottom:32px;padding:32px;background:linear-gradient(135deg,var(--surface) 0%,var(--bg-2) 100%);border:1px solid var(--border);border-radius:20px;overflow:hidden}
.page-hero::before{content:"";position:absolute;top:-50%;right:-20%;width:60%;height:200%;background:radial-gradient(ellipse,rgba(245,185,66,.15),transparent 70%);pointer-events:none}
.ar .page-hero::before{right:auto;left:-20%}
.hero-chip{display:inline-block;padding:5px 14px;background:rgba(245,185,66,.12);color:var(--accent);border:1px solid rgba(245,185,66,.25);border-radius:20px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px}
.hero-title{font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:800;line-height:1.1;letter-spacing:-1px;margin-bottom:10px;background:linear-gradient(135deg,#fff 0%,#9aa3b8 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ar .hero-title{font-family:'Tajawal',sans-serif;font-weight:900}
.hero-sub{font-size:16px;color:var(--text-dim);max-width:600px;position:relative;z-index:1}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:18px;position:relative;overflow:hidden}
.card-title{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;margin-bottom:14px;color:var(--text);display:flex;align-items:center;gap:10px}
.ar .card-title{font-family:'Tajawal',sans-serif;font-weight:900}
.card-title .num{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),var(--accent-2));border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#0a0e1a;font-family:'JetBrains Mono',monospace}
.card.glow{box-shadow:0 0 30px rgba(245,185,66,.08);border-color:rgba(245,185,66,.2)}
.card.warn{border-color:rgba(248,113,113,.3);background:linear-gradient(135deg,rgba(248,113,113,.05),var(--surface))}
.card.tip{border-color:rgba(74,222,128,.3);background:linear-gradient(135deg,rgba(74,222,128,.05),var(--surface))}
.card.tip::before,.card.warn::before{content:"";position:absolute;top:0;left:0;width:3px;height:100%;background:var(--green)}
.card.warn::before{background:var(--red)}
.ar .card.tip::before,.ar .card.warn::before{left:auto;right:0}

p{margin-bottom:12px;color:var(--text-dim)}
p:last-child{margin-bottom:0}
strong{color:var(--text);font-weight:700}
em{color:var(--accent);font-style:normal;font-weight:600}
.kw{color:var(--cyan);font-weight:600}
.muted{color:var(--text-mute);font-size:14px}

/* Formula box */
.formula{background:linear-gradient(135deg,#0a0e1a,#161b2d);border:1px solid var(--border-light);border-radius:12px;padding:16px 20px;margin:14px 0;font-family:'JetBrains Mono',monospace;font-size:17px;text-align:center;color:var(--cyan);font-weight:600;direction:ltr;letter-spacing:.5px}
.formula .var{color:var(--accent)}
.formula .op{color:var(--text)}

/* Example steps */
.steps{margin:14px 0}
.step{display:flex;gap:14px;margin-bottom:10px;padding:12px;background:var(--bg-2);border-radius:10px;border-left:3px solid var(--green)}
.ar .step{border-left:0;border-right:3px solid var(--green)}
.step .step-num{flex-shrink:0;width:26px;height:26px;background:var(--green);color:#0a0e1a;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;font-family:'JetBrains Mono',monospace}
.step .step-body{flex:1;font-size:14px;color:var(--text)}
.step code{background:rgba(96,165,250,.1);color:var(--blue);padding:2px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:13px}

/* Table */
.tbl{width:100%;border-collapse:collapse;margin:14px 0;background:var(--bg-2);border-radius:10px;overflow:hidden}
.tbl th,.tbl td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);font-size:14px}
.ar .tbl th,.ar .tbl td{text-align:right}
.tbl th{background:var(--surface-2);color:var(--accent);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:1px}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover{background:rgba(245,185,66,.03)}
.tbl code{color:var(--cyan);font-family:'JetBrains Mono',monospace;background:rgba(34,211,238,.08);padding:2px 6px;border-radius:4px;font-size:13px}

/* Bullets */
ul.bul{list-style:none;padding:0;margin:10px 0}
ul.bul li{position:relative;padding:7px 0 7px 22px;color:var(--text-dim);font-size:14px}
.ar ul.bul li{padding:7px 22px 7px 0}
ul.bul li::before{content:"▸";position:absolute;left:0;color:var(--accent);font-weight:bold}
.ar ul.bul li::before{left:auto;right:0;content:"◂"}

/* Grid layouts */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:700px){.grid-2,.grid-3{grid-template-columns:1fr}.grid-4{grid-template-columns:repeat(2,1fr)}}

.stat{background:var(--bg-2);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.stat .val{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;color:var(--accent)}
.stat .lbl{font-size:11px;color:var(--text-mute);text-transform:uppercase;letter-spacing:1px;margin-top:4px}

/* Section divider */
.section-title{font-family:'Space Grotesk',sans-serif;font-size:14px;text-transform:uppercase;letter-spacing:2px;color:var(--accent);font-weight:700;margin:28px 0 14px;padding-left:14px;border-left:3px solid var(--accent);position:relative}
.ar .section-title{padding-left:0;padding-right:14px;border-left:0;border-right:3px solid var(--accent);font-family:'Tajawal',sans-serif}

/* Quiz */
.quiz-box{background:linear-gradient(135deg,var(--surface) 0%,var(--bg-2) 100%);border:1px solid var(--border);border-radius:16px;padding:24px;margin:20px 0;position:relative;overflow:hidden}
.quiz-box::before{content:"";position:absolute;top:0;left:0;width:100%;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2),var(--purple),var(--cyan));background-size:200% 100%;animation:shimmer 3s linear infinite}
@keyframes shimmer{0%{background-position:0% 0%}100%{background-position:200% 0%}}
.quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.quiz-header h3{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700}
.ar .quiz-header h3{font-family:'Tajawal',sans-serif}
.quiz-progress{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-dim);font-weight:600}
.quiz-q{margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.quiz-q:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.q-text{font-size:15px;color:var(--text);margin-bottom:12px;font-weight:500;line-height:1.5}
.q-text .qnum{display:inline-block;padding:3px 10px;background:var(--accent);color:#0a0e1a;border-radius:6px;font-weight:700;font-size:12px;margin-right:8px;font-family:'JetBrains Mono',monospace}
.ar .q-text .qnum{margin-right:0;margin-left:8px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{padding:11px 14px;background:var(--bg-2);border:1px solid var(--border);border-radius:9px;cursor:pointer;color:var(--text-dim);font-size:14px;transition:all .15s;display:flex;align-items:center;gap:10px}
.opt:hover{border-color:var(--accent);color:var(--text);background:rgba(245,185,66,.05)}
.opt .lt{display:inline-grid;place-items:center;width:24px;height:24px;background:var(--surface-2);border-radius:6px;font-weight:700;font-size:12px;color:var(--text-mute);font-family:'JetBrains Mono',monospace;flex-shrink:0}
.opt.selected{border-color:var(--blue);background:rgba(96,165,250,.08);color:var(--text)}
.opt.selected .lt{background:var(--blue);color:#0a0e1a}
.opt.correct{border-color:var(--green);background:rgba(74,222,128,.1);color:var(--green);pointer-events:none}
.opt.correct .lt{background:var(--green);color:#0a0e1a}
.opt.wrong{border-color:var(--red);background:rgba(248,113,113,.1);color:var(--red);pointer-events:none}
.opt.wrong .lt{background:var(--red);color:#0a0e1a}
.opt.disabled{pointer-events:none;opacity:.5}
.explain{display:none;margin-top:10px;padding:11px 14px;background:rgba(96,165,250,.08);border-left:3px solid var(--blue);border-radius:6px;font-size:13px;color:var(--text-dim);line-height:1.6}
.ar .explain{border-left:0;border-right:3px solid var(--blue)}
.explain.show{display:block;animation:slideDown .3s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.explain strong{color:var(--blue)}

/* Buttons */
.btn{padding:11px 22px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--surface);border-color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#0a0e1a;border:0}
.btn.primary:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 6px 20px rgba(245,185,66,.3)}
.btn.green{background:var(--green);color:#0a0e1a;border:0}
.btn.large{padding:14px 32px;font-size:16px}

/* Score banner */
.score-banner{background:linear-gradient(135deg,rgba(74,222,128,.15),rgba(34,211,238,.1));border:1px solid rgba(74,222,128,.3);border-radius:16px;padding:24px;text-align:center;margin:20px 0}
.score-banner.low{background:linear-gradient(135deg,rgba(248,113,113,.15),rgba(245,185,66,.1));border-color:rgba(248,113,113,.3)}
.score-banner .big{font-family:'JetBrains Mono',monospace;font-size:38px;font-weight:800;color:var(--green);margin-bottom:6px}
.score-banner.low .big{color:var(--red)}
.score-banner .msg{font-size:15px;color:var(--text)}

/* Animations - Bohr atom */
.atom{position:relative;width:240px;height:240px;margin:20px auto;display:flex;justify-content:center;align-items:center}
.atom .nucleus{position:absolute;width:36px;height:36px;background:radial-gradient(circle at 30% 30%,#ffd166,#ff6b6b);border-radius:50%;box-shadow:0 0 30px rgba(255,107,107,.6),inset -4px -4px 8px rgba(0,0,0,.3);z-index:5;animation:pulse 2s ease-in-out infinite}
.atom .orbit{position:absolute;border:1px solid rgba(96,165,250,.3);border-radius:50%;display:flex;justify-content:center;align-items:center}
.atom .orbit-1{width:90px;height:90px;animation:spin 4s linear infinite}
.atom .orbit-2{width:160px;height:160px;animation:spin 7s linear infinite reverse}
.atom .orbit-3{width:230px;height:230px;animation:spin 10s linear infinite}
.atom .electron{position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:10px;height:10px;background:radial-gradient(circle,#60a5fa,#3b82f6);border-radius:50%;box-shadow:0 0 12px var(--blue)}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* Reaction animation */
.reaction-anim{background:var(--bg-2);border:1px solid var(--border);border-radius:14px;padding:24px;margin:16px 0;display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;min-height:140px}
.molecule{display:flex;align-items:center;gap:3px;padding:14px 18px;background:var(--surface);border:1px solid var(--border);border-radius:12px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;animation:wiggle 3s ease-in-out infinite}
.molecule.glow-r{box-shadow:0 0 20px rgba(248,113,113,.3);border-color:rgba(248,113,113,.4)}
.molecule.glow-b{box-shadow:0 0 20px rgba(96,165,250,.3);border-color:rgba(96,165,250,.4)}
.molecule.glow-g{box-shadow:0 0 20px rgba(74,222,128,.3);border-color:rgba(74,222,128,.4)}
.molecule.glow-p{box-shadow:0 0 20px rgba(192,132,252,.3);border-color:rgba(192,132,252,.4)}
@keyframes wiggle{0%,100%{transform:translate(0,0) rotate(0deg)}25%{transform:translate(-3px,2px) rotate(-1deg)}75%{transform:translate(3px,-2px) rotate(1deg)}}
.arrow{font-size:28px;color:var(--accent);animation:flow 1.5s ease-in-out infinite}
@keyframes flow{0%,100%{transform:translateX(0);opacity:.7}50%{transform:translateX(5px);opacity:1}}
.ar .arrow{transform:scaleX(-1)}

/* Gas particles animation */
.gas-box{position:relative;width:100%;max-width:400px;height:200px;background:linear-gradient(135deg,#0a0e1a,#161b2d);border:2px solid var(--border-light);border-radius:14px;margin:16px auto;overflow:hidden}
.gas-particle{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#22d3ee,#0891b2);box-shadow:0 0 10px var(--cyan)}

/* Periodic mini */
.pt-grid{display:grid;grid-template-columns:repeat(18,1fr);gap:2px;font-size:9px}
.pt-cell{aspect-ratio:1;background:var(--surface);border:1px solid var(--border);border-radius:3px;display:grid;place-items:center;color:var(--text-dim);font-weight:700;cursor:pointer;transition:all .15s;font-family:'JetBrains Mono',monospace}
.pt-cell:hover{transform:scale(1.2);z-index:5;border-color:var(--accent);color:var(--accent)}
.pt-cell.alkali{background:rgba(248,113,113,.15);color:var(--red);border-color:rgba(248,113,113,.3)}
.pt-cell.alkaline{background:rgba(245,185,66,.15);color:var(--accent);border-color:rgba(245,185,66,.3)}
.pt-cell.halogen{background:rgba(34,211,238,.15);color:var(--cyan);border-color:rgba(34,211,238,.3)}
.pt-cell.noble{background:rgba(192,132,252,.15);color:var(--purple);border-color:rgba(192,132,252,.3)}
.pt-cell.transition{background:rgba(96,165,250,.12);color:var(--blue);border-color:rgba(96,165,250,.25)}
.pt-cell.metalloid{background:rgba(74,222,128,.12);color:var(--green);border-color:rgba(74,222,128,.25)}

/* VSEPR shapes */
.shape-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:14px 0}
.shape-card{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.shape-card svg{width:120px;height:100px;margin:0 auto;display:block}
.shape-card .nm{font-size:13px;font-weight:700;color:var(--text);margin-top:8px}
.shape-card .ex{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);margin-top:3px}

/* Game styles */
.game-board{background:linear-gradient(135deg,var(--surface),var(--bg-2));border:1px solid var(--border);border-radius:16px;padding:24px;margin:20px 0}
.game-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.game-stat{display:flex;gap:14px;font-family:'JetBrains Mono',monospace}
.game-stat .s{padding:6px 14px;background:var(--bg);border-radius:8px;font-weight:700;font-size:13px}
.game-stat .s .lb{color:var(--text-mute);font-size:10px;text-transform:uppercase;letter-spacing:1px}
.game-stat .s .vl{color:var(--accent);font-size:18px}

.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.match-col{display:flex;flex-direction:column;gap:8px}
.match-item{padding:11px 16px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-weight:600;text-align:center;transition:all .15s;user-select:none}
.match-item:hover{border-color:var(--accent);transform:translateX(2px)}
.match-item.sel{border-color:var(--blue);background:rgba(96,165,250,.1);color:var(--blue)}
.match-item.done{opacity:.3;pointer-events:none}
.match-item.flash-good{animation:flashGood .5s ease}
.match-item.flash-bad{animation:flashBad .5s ease}
@keyframes flashGood{0%,100%{background:var(--bg)}50%{background:rgba(74,222,128,.3);border-color:var(--green)}}
@keyframes flashBad{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px);background:rgba(248,113,113,.2)}75%{transform:translateX(5px)}}

/* Drag-drop balance game */
.balance-game{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:14px}
.coef-input{width:50px;height:50px;background:var(--bg);border:2px dashed var(--accent);border-radius:8px;color:var(--text);font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;text-align:center;outline:none}
.coef-input:focus{border-style:solid;background:rgba(245,185,66,.05)}
.formula-piece{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;color:var(--text);padding:8px 4px}

/* Notification */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--surface);border:1px solid var(--border);padding:12px 24px;border-radius:12px;color:var(--text);font-weight:600;z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:transform .3s ease;display:flex;align-items:center;gap:10px}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.good{border-color:var(--green);color:var(--green)}
.toast.bad{border-color:var(--red);color:var(--red)}

/* Badges */
.badges-row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.badge{padding:6px 12px;background:var(--bg-2);border:1px solid var(--border);border-radius:20px;font-size:11px;color:var(--text-dim);display:inline-flex;align-items:center;gap:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.badge.earned{background:linear-gradient(135deg,rgba(245,185,66,.15),rgba(255,107,107,.1));border-color:rgba(245,185,66,.3);color:var(--accent)}
.badge .icn{font-size:14px}

/* Home tiles */
.home-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:20px 0}
.home-tile{padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:14px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.home-tile:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.home-tile .ico{font-size:32px;margin-bottom:10px}
.home-tile .ti{font-weight:700;color:var(--text);margin-bottom:4px;font-size:15px}
.home-tile .de{font-size:12px;color:var(--text-mute)}

/* Toggle for AR/EN content blocks */
.lang-en{display:block}
.lang-ar{display:none}
.ar .lang-en{display:none}
.ar .lang-ar{display:block}

/* Sub-tabs within a chapter */
.subtabs{display:flex;gap:4px;margin-bottom:18px;background:var(--surface);padding:4px;border-radius:12px;border:1px solid var(--border);overflow-x:auto}
.subtab{padding:8px 16px;background:transparent;border:0;color:var(--text-dim);font-weight:600;font-size:13px;cursor:pointer;border-radius:8px;transition:all .2s;font-family:inherit;white-space:nowrap}
.subtab.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#0a0e1a}
.subtab:hover:not(.active){color:var(--text)}

/* Tags */
.tag{display:inline-block;padding:2px 8px;background:rgba(192,132,252,.15);color:var(--purple);border-radius:6px;font-size:11px;font-weight:600;margin-right:4px}

/* v3: Story card */
.story-card{display:flex;gap:14px;padding:18px;background:linear-gradient(135deg,rgba(245,185,66,.08),rgba(96,165,250,.05));border:1px solid rgba(245,185,66,.2);border-radius:14px;margin-bottom:24px;align-items:flex-start}
.story-icon{font-size:32px;flex-shrink:0;animation:pulse 2s infinite}
.story-text{font-size:15px;color:var(--text);line-height:1.7;font-style:italic}
.ar .story-text{font-style:normal;font-weight:500}

/* v3: Confetti */
.confetti{position:fixed;top:-10px;width:10px;height:10px;border-radius:2px;z-index:9999;pointer-events:none;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* v3: Periodic table extras */
.pt-cell{padding:6px 2px;flex-direction:column}
.pt-cell .pt-sym{font-size:13px;font-weight:700}
.pt-cell .pt-z{font-size:8px;opacity:.7}
.pt-empty{aspect-ratio:1}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.lg-item{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600}
.lg-item.alkali{background:rgba(248,113,113,.15);color:var(--red)}
.lg-item.alkaline{background:rgba(245,185,66,.15);color:var(--accent)}
.lg-item.transition{background:rgba(96,165,250,.15);color:var(--blue)}
.lg-item.metalloid{background:rgba(74,222,128,.15);color:var(--green)}
.lg-item.nonmetal{background:rgba(192,132,252,.15);color:var(--purple)}
.lg-item.halogen{background:rgba(34,211,238,.15);color:var(--cyan)}
.lg-item.noble{background:rgba(244,114,182,.15);color:var(--pink)}
.pt-cell.metal{background:rgba(245,185,66,.08);color:var(--accent);border-color:rgba(245,185,66,.2)}

</style>
</head>

<script>
// ============================================================
// STATE & PERSISTENCE
// ============================================================
const EXAM_HOURS_REMAINING = 14;
const TIMER_END = Date.now() + EXAM_HOURS_REMAINING * 3600 * 1000;

const STORAGE_KEY = 'chm101_progress_v2';

let STATE = {
  lang: 'en',
  page: 'home',
  progress: {},  // {ch1: {read: true, examScore: 8, examTotal: 10}, ...}
  badges: [],
};

function loadState(){
  try{
    const s = localStorage.getItem(STORAGE_KEY);
    if(s){
      const p = JSON.parse(s);
      STATE.progress = p.progress || {};
      STATE.badges = p.badges || [];
      STATE.lang = p.lang || 'en';
    }
  }catch(e){}
}
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      progress: STATE.progress,
      badges: STATE.badges,
      lang: STATE.lang,
    }));
  }catch(e){}
}

function markRead(ch){
  if(!STATE.progress[ch]) STATE.progress[ch] = {};
  STATE.progress[ch].read = true;
  saveState();
  updateProgressUI();
}
function markExam(ch, score, total){
  if(!STATE.progress[ch]) STATE.progress[ch] = {};
  STATE.progress[ch].examScore = score;
  STATE.progress[ch].examTotal = total;
  STATE.progress[ch].read = true;
  saveState();
  updateProgressUI();
  // Check for badges
  if(score === total) addBadge('perfect_' + ch);
  if(score/total >= 0.8) addBadge('master_' + ch);
}
function addBadge(id){
  if(!STATE.badges.includes(id)){
    STATE.badges.push(id);
    saveState();
    toast(STATE.lang==='ar'?'🏆 إنجاز جديد!':'🏆 New badge unlocked!','good');
  }
}

function updateProgressUI(){
  const chapters = ['ch1','ch2','ch3','ch4','ch5','ch6','ch7','ch8','ch9','ch10','ch24'];
  let total = 0, completed = 0;
  chapters.forEach(ch => {
    total += 2; // 1 for read, 1 for exam pass
    const p = STATE.progress[ch];
    if(p){
      if(p.read) completed += 1;
      if(p.examScore !== undefined && p.examScore / p.examTotal >= 0.6) completed += 1;
    }
  });
  const pct = Math.round(completed/total*100);
  document.getElementById('overall-pct').textContent = pct + '%';
  document.getElementById('overall-fill').style.width = pct + '%';
  
  document.querySelectorAll('.nav-item .dot').forEach(d => {
    const ch = d.dataset.prog;
    const p = STATE.progress[ch];
    d.classList.remove('done','partial');
    if(p){
      if(p.examScore !== undefined && p.examScore / p.examTotal >= 0.6) d.classList.add('done');
      else if(p.read) d.classList.add('partial');
    }
  });
}

function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type||'');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ============================================================
// LANGUAGE
// ============================================================
function setLang(lang){
  STATE.lang = lang;
  saveState();
  document.body.classList.toggle('ar', lang==='ar');
  document.body.classList.toggle('en', lang==='en');
  document.getElementById('root').setAttribute('dir', lang==='ar'?'rtl':'ltr');
  document.getElementById('root').setAttribute('lang', lang);
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang===lang));
  // Update all data-en/data-ar elements
  document.querySelectorAll('[data-en]').forEach(el => {
    const v = el.dataset[lang];
    if(v) el.textContent = v;
  });
  render();
}

// ============================================================
// PARTICLES (floating background)
// ============================================================
function makeParticles(){
  const container = document.getElementById('particles');
  const colors = ['#f5b942','#60a5fa','#c084fc','#22d3ee','#4ade80','#f472b6'];
  for(let i=0; i<25; i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 6 + 3;
    p.style.width = p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = '110%';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDelay = -Math.random() * 20 + 's';
    p.style.animationDuration = (15 + Math.random() * 10) + 's';
    container.appendChild(p);
  }
}

// ============================================================
// TIMER
// ============================================================
function updateTimer(){
  const remaining = Math.max(0, TIMER_END - Date.now());
  const h = Math.floor(remaining / 3600000);
  const m = Math.floor((remaining % 3600000) / 60000);
  const s = Math.floor((remaining % 60000) / 1000);
  const el = document.getElementById('timer');
  if(el) el.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// ============================================================
// QUIZ ENGINE
// ============================================================
const QUIZ_STATE = {}; // {chId: {answers: {}, submitted: false}}

function getQuizState(qid){
  if(!QUIZ_STATE[qid]) QUIZ_STATE[qid] = {answers:{}, submitted:false};
  return QUIZ_STATE[qid];
}

function selectAnswer(qid, qIdx, optIdx){
  const s = getQuizState(qid);
  if(s.submitted) return;
  s.answers[qIdx] = optIdx;
  // Update UI
  document.querySelectorAll(`[data-quiz="${qid}"][data-q="${qIdx}"] .opt`).forEach((el, i) => {
    el.classList.toggle('selected', i === optIdx);
  });
}

function submitQuiz(qid, questions, chKey){
  const s = getQuizState(qid);
  s.submitted = true;
  let score = 0;
  questions.forEach((q, i) => {
    const userAns = s.answers[i];
    const opts = document.querySelectorAll(`[data-quiz="${qid}"][data-q="${i}"] .opt`);
    opts.forEach((el, j) => {
      el.classList.add('disabled');
      el.classList.remove('selected');
      if(j === q.a) el.classList.add('correct');
      else if(j === userAns) el.classList.add('wrong');
    });
    const expl = document.querySelector(`[data-quiz="${qid}"][data-q="${i}"] .explain`);
    if(expl) expl.classList.add('show');
    if(userAns === q.a) score++;
  });
  
  // Show banner
  const banner = document.getElementById(qid + '-banner');
  const pct = score / questions.length;
  if(banner){
    banner.innerHTML = makeScoreBanner(score, questions.length);
    banner.scrollIntoView({behavior:'smooth', block:'center'});
  }
  
  if(chKey) markExam(chKey, score, questions.length);
  
  if(pct >= 0.8) toast(STATE.lang==='ar'?'🎉 ممتاز!':'🎉 Excellent!','good');
  else if(pct >= 0.6) toast(STATE.lang==='ar'?'✓ كويس':'✓ Good job','good');
  else toast(STATE.lang==='ar'?'حاول مرة ثانية':'Try again','bad');
}

function makeScoreBanner(score, total){
  const pct = Math.round(score/total*100);
  const isLow = pct < 60;
  const msgs_en = {
    high: 'Mastered. Move to next chapter.',
    good: 'Good. Review your mistakes.',
    low: 'Read the chapter again carefully.',
  };
  const msgs_ar = {
    high: 'ممتاز. انتقل للفصل التالي.',
    good: 'كويس. راجع أخطاءك.',
    low: 'ارجع للفصل واقرأه بتركيز.',
  };
  const M = STATE.lang==='ar'?msgs_ar:msgs_en;
  const msg = pct >= 80 ? M.high : pct >= 60 ? M.good : M.low;
  return `<div class="score-banner ${isLow?'low':''}">
    <div class="big">${score}/${total} · ${pct}%</div>
    <div class="msg">${msg}</div>
  </div>`;
}

function renderQuiz(qid, questions, chKey, titleEn, titleAr){
  const title_en = titleEn || 'Chapter Exam';
  const title_ar = titleAr || 'امتحان الفصل';
  const t = STATE.lang==='ar' ? title_ar : title_en;
  const submitTxt = STATE.lang==='ar' ? '✓ صحّح الامتحان' : '✓ Submit Exam';
  return `
<div class="quiz-box">
  <div class="quiz-header">
    <h3>📝 ${t}</h3>
    <div class="quiz-progress">${questions.length} ${STATE.lang==='ar'?'سؤال':'questions'}</div>
  </div>
  <div id="${qid}-banner"></div>
  ${questions.map((q, i) => `
    <div class="quiz-q" data-quiz="${qid}" data-q="${i}">
      <div class="q-text"><span class="qnum">Q${i+1}</span>${STATE.lang==='ar'?(q.qar||q.q):q.q}</div>
      <div class="opts">
        ${q.o.map((opt, j) => {
          const text = STATE.lang==='ar' && q.oar ? q.oar[j] : opt;
          return `<div class="opt" onclick="selectAnswer('${qid}',${i},${j})">
            <span class="lt">${['A','B','C','D'][j]}</span>${text}
          </div>`;
        }).join('')}
      </div>
      <div class="explain"><strong>${STATE.lang==='ar'?'الشرح':'Explanation'}:</strong> ${STATE.lang==='ar'?(q.ear||q.e):q.e}</div>
    </div>
  `).join('')}
  <div style="text-align:center;margin-top:18px">
    <button class="btn primary large" onclick='submitQuiz("${qid}", ${JSON.stringify(questions).replace(/'/g,"&apos;")}, ${chKey?`"${chKey}"`:'null'})'>${submitTxt}</button>
  </div>
</div>`;
}

// ============================================================
// RENDER & NAVIGATION
// ============================================================
function render(){
  const fn = CONTENT[STATE.page];
  if(!fn){ document.getElementById('content').innerHTML = '<p>404</p>'; return; }
  document.getElementById('content').innerHTML = fn();
  // Update language texts
  document.querySelectorAll('[data-en]').forEach(el => {
    const v = el.dataset[STATE.lang];
    if(v) el.textContent = v;
  });
  // Re-init any in-page scripts (animations)
  initPageEffects();
}

function nav(page){
  STATE.page = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo(0, 0);
  render();
  // Mark as read when visited (except home/tools)
  if(page.startsWith('ch')) markRead(page);
}

function initPageEffects(){
  // Animate gas particles if present
  document.querySelectorAll('.gas-box').forEach(box => {
    if(box.dataset.init) return;
    box.dataset.init = '1';
    const n = parseInt(box.dataset.count) || 8;
    for(let i=0; i<n; i++){
      const p = document.createElement('div');
      p.className = 'gas-particle';
      p.style.left = Math.random() * 90 + '%';
      p.style.top = Math.random() * 85 + '%';
      let vx = (Math.random() - 0.5) * 2;
      let vy = (Math.random() - 0.5) * 2;
      let x = parseFloat(p.style.left);
      let y = parseFloat(p.style.top);
      box.appendChild(p);
      setInterval(() => {
        x += vx; y += vy;

      }, 50);
    }
  });

const MATCH_PAIRS = [
  ['H','Hydrogen'],['He','Helium'],['Li','Lithium'],['C','Carbon'],['N','Nitrogen'],

function startMatchGame(){
  // Pick 6 random pairs
  const shuffled = [...MATCH_PAIRS].sort(() => Math.random() - 0.5).slice(0, 6);
  GAME_STATE.match = {
    score: 0, total: 6, selected: null,
    pairs: shuffled,
    leftOrder: shuffled.map(p => p[0]).sort(() => Math.random() - 0.5),
    rightOrder: shuffled.map(p => p[1]).sort(() => Math.random() - 0.5),
    matched: [],
  };
  renderMatchGame();
}

function renderMatchGame(){
  const s = GAME_STATE.match;
  const area = document.getElementById('game-area');
  if(!area) return;
  area.innerHTML = `
<div class="game-board">
  <div class="game-header">
    <h3>🔬 ${T('Element Match','مطابقة العناصر')}</h3>
    <div class="game-stat">
      <div class="s"><div class="lb">${T('Score','النقاط')}</div><div class="vl">${s.score}/${s.total}</div></div>
      <button class="btn" onclick="startMatchGame()">↻ ${T('New','جديدة')}</button>
    </div>
  </div>
  <p class="muted" style="margin-bottom:14px">${T('Tap a symbol, then tap its name. Match all 6 pairs!','اضغط الرمز ثم الاسم. طابق ٦ أزواج!')}</p>
  <div class="match-grid">
    <div class="match-col">
      ${s.leftOrder.map(sym => `
        <div class="match-item ${s.matched.includes(sym)?'done':''} ${s.selected===sym?'sel':''}" 
             onclick="matchSelect('left','${sym}')" data-key="L-${sym}">${sym}</div>
      `).join('')}
    </div>
    <div class="match-col">
      ${s.rightOrder.map(name => `
        <div class="match-item ${s.matched.includes(name)?'done':''}" 
             onclick="matchSelect('right','${name}')" data-key="R-${name}">${name}</div>
      `).join('')}
    </div>
  </div>
  ${s.score === s.total ? `
    <div class="score-banner" style="margin-top:18px">
      <div class="big">🎉 ${s.score}/${s.total}</div>
      <div class="msg">${T('Perfect! New round?','ممتاز! دورة جديدة؟')}</div>
      <button class="btn primary" onclick="startMatchGame()" style="margin-top:10px">${T('Play Again','العب مرة ثانية')}</button>
    </div>
  ` : ''}
</div>`;
}

function matchSelect(side, val){
  const s = GAME_STATE.match;
  if(s.matched.includes(val)) return;
  
  if(side === 'left'){
    s.selected = val;
    renderMatchGame();
    return;
  }
  // right click - check match
  if(!s.selected) return;
  const correct = s.pairs.find(p => p[0] === s.selected && p[1] === val);
  if(correct){
    s.matched.push(s.selected, val);
    s.score++;
    s.selected = null;
    toast('✓ ' + T('Correct!','صح!'), 'good');
    renderMatchGame();
  } else {
    // Flash bad
    const el = document.querySelector(`[data-key="R-${val}"]`);
    if(el){
      el.classList.add('flash-bad');
      setTimeout(() => { el.classList.remove('flash-bad'); s.selected = null; renderMatchGame(); }, 500);
    }
    toast('✗ ' + T('Try again','حاول مرة ثانية'), 'bad');
  }
}

function startBalanceGame(){

function nextBalance(){
  const idx = Math.floor(Math.random() * BALANCE_PROBLEMS.length);
  GAME_STATE.balance.current = JSON.parse(JSON.stringify(BALANCE_PROBLEMS[idx]));
  renderBalanceGame();
}

function renderBalanceGame(){
  const s = GAME_STATE.balance;
  const p = s.current;
  if(!p) return;
  let qIdx = 0;
  const eqHTML = p.eq.map(piece => {
    if(piece === '?'){
      return `<input class="coef-input" id="coef-${qIdx++}" type="number" min="1" max="20" placeholder="?">`;
    }
    return `<span class="formula-piece">${piece}</span>`;
  }).join('');
  
  const area = document.getElementById('game-area');
  if(!area) return;
  area.innerHTML = `

  <div class="game-header">

function checkBalance(){
  const s = GAME_STATE.balance;
  const ans = s.current.a;
  const inputs = document.querySelectorAll('.coef-input');
  let correct = true;
  inputs.forEach((inp, i) => {
    if(parseInt(inp.value) !== ans[i]) correct = false;
  });
  if(correct){
    s.score++;
    s.streak++;
    toast('✓ ' + T('Balanced!','متوازنة!'), 'good');
    setTimeout(nextBalance, 800);
  } else {
    s.streak = 0;
    inputs.forEach(inp => inp.style.borderColor = 'var(--red)');
    setTimeout(() => inputs.forEach(inp => inp.style.borderColor = 'var(--accent)'), 1000);
    toast('✗ ' + T('Check again. Hint: coefficients are ' + ans.join(', '),'افحص. التلميح: ' + ans.join(', ')), 'bad');
  }
}

function startQuickfire(){
  GAME_STATE.quickfire = {score: 0, lives: 3, timeLeft: 60, current: null, timer: null};
  if(GAME_STATE.quickfire.timer) clearInterval(GAME_STATE.quickfire.timer);
  GAME_STATE.quickfire.timer = setInterval(() => {
    GAME_STATE.quickfire.timeLeft--;
    if(GAME_STATE.quickfire.timeLeft <= 0){
      endQuickfire();
    } else {
      const el = document.getElementById('qf-time');
      if(el) el.textContent = GAME_STATE.quickfire.timeLeft;
    }
  }, 1000);
  nextQuickfire();
}

function nextQuickfire(){
  GAME_STATE.quickfire.current = QUICKFIRE_POOL[Math.floor(Math.random() * QUICKFIRE_POOL.length)];
  renderQuickfire();
}

  const s = GAME_STATE.quickfire;
  const q = s.current;
  const area = document.getElementById('game-area');
  if(!area || !q) return;
  area.innerHTML = `

function answerQuickfire(idx){
  const s = GAME_STATE.quickfire;

const FINAL_STATE = {answers:{}, submitted:false};

CONTENT.final = () => {
  if(FINAL_STATE.submitted){
    let score = 0;
    FINAL_QUESTIONS.forEach((q,i) => { if(FINAL_STATE.answers[i] === q.a) score++; });
    const pct = Math.round(score / FINAL_QUESTIONS.length * 100);
    let msg;
    if(pct >= 90) msg = T('Exam-ready. Excellent! 🎉','جاهز للامتحان! 🎉');
    else if(pct >= 75) msg = T('Good. Review the mistakes.','كويس. راجع الأخطاء.');
    else if(pct >= 60) msg = T('Okay. Focus on weak chapters.','مقبول. ركّز على الضعيف.');
    else msg = T('Need more review. Start from Ch 3 & 4.','تحتاج مراجعة. ابدأ من ٣ و ٤.');
    
    return `
<div class="page-hero">
  <h1 class="hero-title">${T('Final Exam Results','نتيجة الامتحان الشامل')}</h1>
</div>
<div class="score-banner ${pct<60?'low':''}">
  <div class="big">${score}/${FINAL_QUESTIONS.length} · ${pct}%</div>
  <div class="msg">${msg}</div>
  <button class="btn primary" onclick="resetFinal()" style="margin-top:14px">${T('Retake','أعد')}</button>
</div>
${FINAL_QUESTIONS.map((q, i) => {
  const userAns = FINAL_STATE.answers[i];
  return `<div class="quiz-q">
    <div class="q-text"><span class="qnum">Q${i+1}</span>${T(q.q, q.qar)} <span style="color:var(--text-mute);font-size:11px">(Ch ${q.ch})</span></div>
    <div class="opts">
      ${q.o.map((opt, j) => {
        let cls = '';
        if(j === q.a) cls = 'correct';
        else if(j === userAns) cls = 'wrong';
        return `<div class="opt ${cls}"><span class="lt">${['A','B','C','D'][j]}</span>${opt}</div>`;
      }).join('')}
    </div>
    <div class="explain show"><strong>${T('Explanation','الشرح')}:</strong> ${T(q.e, q.ear||q.e)}</div>
  </div>`;
}).join('')}
`;
  }
  
  return `
<div class="page-hero">
  <div class="hero-chip">${T('★ FINAL EXAM','★ الامتحان الشامل')}</div>
  <h1 class="hero-title">${T('Comprehensive Test','اختبار شامل')}</h1>
  <p class="hero-sub">${T(FINAL_QUESTIONS.length + ' mixed questions across all 11 chapters. Take your time.', FINAL_QUESTIONS.length + ' سؤال متنوع عبر كل الفصول. خذ وقتك.')}</p>
</div>
<div class="card tip"><strong>${T('💡 Tip','💡 نصيحة')}:</strong> ${T('Don\'t guess. Mark hard ones and come back.','لا تخمّن. علّم الصعب وارجع له.')}</div>
${FINAL_QUESTIONS.map((q, i) => `
  <div class="quiz-q">
    <div class="q-text"><span class="qnum">Q${i+1}</span>${T(q.q, q.qar)} <span style="color:var(--text-mute);font-size:11px">(Ch ${q.ch})</span></div>
    <div class="opts">
      ${q.o.map((opt, j) => `<div class="opt ${FINAL_STATE.answers[i]===j?'selected':''}" onclick="selectFinal(${i},${j})">
        <span class="lt">${['A','B','C','D'][j]}</span>${opt}
      </div>`).join('')}
    </div>
  </div>
`).join('')}
<div style="text-align:center;margin-top:30px">
  <button class="btn primary large" onclick="submitFinal()">${T('✓ Submit Final Exam','✓ صحّح الامتحان')}</button>
</div>
`;
};

function selectFinal(qIdx, optIdx){
  if(FINAL_STATE.submitted) return;
  FINAL_STATE.answers[qIdx] = optIdx;
  render();
}

function submitFinal(){
  FINAL_STATE.submitted = true;
  let score = 0;
  FINAL_QUESTIONS.forEach((q,i) => { if(FINAL_STATE.answers[i] === q.a) score++; });
  markExam('final', score, FINAL_QUESTIONS.length);
  render();
}

function resetFinal(){
  FINAL_STATE.answers = {};
  FINAL_STATE.submitted = false;
  render();
}

// --- CONFETTI ANIMATION ---
function fireConfetti(){
  const colors = ['#f5b942','#ff6b6b','#60a5fa','#4ade80','#c084fc','#22d3ee'];
  const container = document.body;
  for(let i=0; i<80; i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDelay = (Math.random() * 0.5) + 's';
    c.style.animationDuration = (2 + Math.random() * 2) + 's';
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    container.appendChild(c);
    setTimeout(() => c.remove(), 4500);
  }
}

// Hook into submitQuiz to fire confetti on high scores
const origSubmit = submitQuiz;
submitQuiz = function(qid, questions, chKey){
  origSubmit(qid, questions, chKey);
  const s = QUIZ_STATE[qid];
  if(s){
    let score = 0;
    questions.forEach((q, i) => { if(s.answers[i] === q.a) score++; });
    if(score / questions.length >= 0.8) fireConfetti();
    // Track mistakes
    questions.forEach((q, i) => {
      if(s.answers[i] !== undefined && s.answers[i] !== q.a){
        addMistake(chKey || qid, q);
      }
    });
  }
};

// --- MISTAKES REVIEW ---
function addMistake(chId, q){
  if(!STATE.mistakes) STATE.mistakes = [];
  // Avoid duplicates by question text
  const key = (q.q || '') + '|' + chId;
  if(!STATE.mistakes.some(m => m.key === key)){
    STATE.mistakes.push({...q, ch: chId, key, ts: Date.now()});
    saveState();
  }
}

function clearMistakes(){
  if(confirm(T('Clear all mistakes from review?', 'مسح كل الأخطاء من المراجعة؟'))){
    STATE.mistakes = [];
    saveState();
    render();
  }
}

// --- POWER MODE (random questions across chapters) ---
const POWER_STATE = {answers:{}, submitted:false, count:50, questions:[]};

function startPowerMode(count){
  const pools = {
    'ch1': CH1_QUESTIONS, 'ch2': CH2_QUESTIONS, 'ch3': CH3_QUESTIONS,
    'ch4': CH4_QUESTIONS, 'ch5': CH5_QUESTIONS, 'ch6': CH6_QUESTIONS,
    'ch7': CH7_QUESTIONS, 'ch8': CH8_QUESTIONS, 'ch9': CH9_QUESTIONS,
    'ch10': CH10_QUESTIONS, 'ch24': CH24_QUESTIONS,
  };
  const all = [];
  for(const [ch, qs] of Object.entries(pools)){
    qs.forEach(q => all.push({...q, ch}));
  }
  // Shuffle
  const shuffled = [...all].sort(() => Math.random() - 0.5).slice(0, count);
  POWER_STATE.questions = shuffled;
  POWER_STATE.answers = {};
  POWER_STATE.submitted = false;
  POWER_STATE.count = count;
  STATE.page = 'power';
  render();
}
